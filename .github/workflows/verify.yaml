name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: appointment-ci
      POSTGRES_PORT: 5432
      RABBITMQ_PORT: 5672
      TEST_DATABASE_URL: postgresql://diagnostic:diagnostic_dev@127.0.0.1:5432/diagnostic_appointments
      TEST_RABBITMQ_URL: amqp://diagnostic:diagnostic_dev@127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Definitions are mounted only after checkout, including fresh synthetic credentials.
      - run: docker compose up -d --wait postgres rabbitmq
      - run: node scripts/verify-rabbitmq.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
