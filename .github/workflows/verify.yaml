name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
        env:
          POSTGRES_DB: diagnostic_appointments_test
          POSTGRES_USER: diagnostic
          POSTGRES_PASSWORD: diagnostic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diagnostic -d diagnostic_appointments_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://diagnostic:diagnostic_test@127.0.0.1:5432/diagnostic_appointments_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
